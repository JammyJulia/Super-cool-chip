# Tiny Tapeout project information
project:
  title:        "VGA Guitar Hero"    
  author:       "Julija Osipova"         
  discord:      ""                      
  description:  "Five-string Guitar Hero game with VGA output and audio on uio"  # one line
  language:     "Verilog"      
  clock_hz:     25175000                 # ~25 MHz pixel clock (VGA 640x480)

  tiles: "1x1"                         

  top_module:  "tt_um_project"


  source_files:
    - "tt_um_project.v"
    - "hvsync_generator.v"


pinout:
  # Inputs
  ui[0]: "String 0 (leftmost)"
  ui[1]: "String 1"
  ui[2]: "String 2"
  ui[3]: "String 3"
  ui[4]: "String 4 (rightmost)"
  ui[5]: "START / STOP toggle"
  ui[6]: "PAUSE toggle"
  ui[7]: "unused"

  # Outputs 
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSYNC"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSYNC"

  # Bidirectional pins
  uio[0]: "audio"
  uio[1]: "audio"
  uio[2]: "audio"
  uio[3]: "audio"
  uio[4]: "audio"
  uio[5]: "audio"
  uio[6]: "audio"
  uio[7]: "audio"


yaml_version: 6
